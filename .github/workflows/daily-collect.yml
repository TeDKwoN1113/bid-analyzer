name: 매일 자동 수집

on:
  schedule:
    - cron: "17 20 * * *"   # 매일 한국시간 오전 5시 17분
  workflow_dispatch:         # Actions 화면에서 "Run workflow" 버튼으로 바로 실행 가능

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Seoul
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - run: pip install -r requirements-collector.txt
      - name: 수집 (최근 3일 + 과거 데이터 채우기)
        run: python collector.py --auto
