name: 매일 자동 수집

on:
  # GitHub 예약 실행은 늦어지거나 빠지기도 해서 여러 번 걸어 두고, 실제로 돌지는 collector.py --scheduled 가 정함
  #  - 오늘 전체 수집이 아직이면 → 전체 수집 (새벽에 빠져도 다음 예약에서 따라잡음)
  #  - 최근 2시간 반 안에 수집했으면 → 바로 끝냄 (알림도 생략)
  schedule:
    - cron: "41 19,20,21 * * *"  # 매일 04:41, 05:41, 06:41 (한국시간) - 전체 수집
    - cron: "23 0-9/2 * * 1-5"   # 평일 09:23, 11:23, 13:23, 15:23, 17:23 (한국시간) - 빠른 수집
  workflow_dispatch:              # Actions 화면에서 "Run workflow" 버튼으로 바로 실행
    inputs:
      mode:
        description: "full = 전체 수집, quick = 빠른 수집(오늘 공고·개찰결과만)"
        default: full
        type: choice
        options: [full, quick]

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Seoul
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - run: pip install -r requirements-collector.txt
      # 분석용 표를 실행 사이에 보관 → 원격 DB 에서 최근 공고만 받음 (Neon 무료 전송량 5GB/월 절약)
      - name: 분석 표 캐시 불러오기
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: dscache-${{ github.run_id }}
          restore-keys: dscache-
      - name: 예약 수집 (필요할 때만 전체/빠른 수집)
        id: sched
        if: github.event_name == 'schedule'
        run: python collector.py --scheduled
      - name: 전체 수집 (수동 실행)
        if: github.event_name != 'schedule' && inputs.mode != 'quick'
        run: python collector.py --auto
      - name: 빠른 수집 (수동 실행)
        if: github.event_name != 'schedule' && inputs.mode == 'quick'
        run: python collector.py --quick
      - name: 알림 보내기
        if: always() && steps.sched.outputs.skip != 'true'
        run: python notify.py
      - name: 분석 표 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: dscache-${{ github.run_id }}
      - name: 실패 알림
        if: failure()
        run: python notify.py --alert "자동 수집 중 오류가 났습니다. 확인 주소 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
