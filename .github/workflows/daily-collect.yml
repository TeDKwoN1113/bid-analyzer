name: 매일 자동 수집

on:
  schedule:
    - cron: "17 20 * * *"        # 매일 05:17 (한국시간) - 전체 수집 + 과거 데이터 채우기 + 알림
    - cron: "7 0,4,8 * * 1-5"    # 평일 09:07, 13:07, 17:07 (한국시간) - 빠른 수집 + 알림
  workflow_dispatch:              # Actions 화면에서 "Run workflow" 버튼으로 바로 실행 (전체 수집)

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Seoul
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - run: pip install -r requirements-collector.txt
      - name: 빠른 수집 (낮 시간)
        if: github.event.schedule == '7 0,4,8 * * 1-5'
        run: python collector.py --quick
      - name: 전체 수집 (최근 3일 + 과거 데이터 채우기 + 관심공고 개찰순위)
        if: github.event.schedule != '7 0,4,8 * * 1-5'
        run: python collector.py --auto
      - name: 알림 보내기
        if: always()
        run: python notify.py
      - name: 실패 알림
        if: failure()
        run: python notify.py --alert "자동 수집 중 오류가 났습니다. 확인 주소 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
